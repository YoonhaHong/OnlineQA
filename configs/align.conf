[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"

detectors_file         = ""
detectors_file_updated = ""
histogram_file         = "alignment_run_test.root"

number_of_events = -1

[Metronome]
triggers=1

[EventLoaderEUDAQ2]
file_name = ""

[ClusteringSpatial]

[Correlations]

[Tracking4D]
track_model="straightline"
require_detectors=ALPIDE_0,ALPIDE_1,ALPIDE_2,ALPIDE_3,ALPIDE_4,ALPIDE_5
min_hits_on_track=6
time_cut_abs=1e99
momentum=10GeV
exclude_dut = true
spatial_cut_abs=0.3mm,0.3mm
unique_cluster_usage=true

[AlignmentMillepede]
residual_cut = 0.05mm # default
residual_cut_init = 1mm
iterations = 3
# dofs = TranslationX, TranslationY, TranslationZ, RotationX, RotationY, RotationZ,   
dofs = true, true, false, false, false, true 
sigmas = 50um, 50um, 50um, 0.005rad, 0.005rad, 0.005rad
exclude_dut = true
